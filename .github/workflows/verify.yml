name: Verify optimization results

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Exhaustive-oracle and validation tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce the two benchmark optima and experiments
        run: python -m xinjiang_decision --verify --output-dir /tmp/xinjiang-verification
